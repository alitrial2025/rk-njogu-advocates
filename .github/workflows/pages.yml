name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Type-check and build website
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Clear previous browser evidence
        run: rm -f artifacts/desktop.png artifacts/mobile.png artifacts/browser-report.json docs/PERFORMANCE.md
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Select Playwright Chromium
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { chromium } from 'playwright';
          appendFileSync(process.env.GITHUB_ENV, `CHROMIUM_EXECUTABLE=${chromium.executablePath()}\n`);
          NODE
      - name: Wait for the deployed website
        run: |
          node --input-type=module <<'NODE'
          const expectedTitle = 'R. K. Njogu & Company Advocates | Legal Solutions Made Practical';
          const deadline = Date.now() + 60_000;
          if (!process.env.BASE_URL) throw new Error('Deployment did not return a Pages URL');
          while (Date.now() < deadline) {
            try {
              const response = await fetch(process.env.BASE_URL, {
                signal: AbortSignal.timeout(Math.min(5_000, deadline - Date.now())),
                cache: 'no-store',
              });
              const html = await response.text();
              const title = html.match(/<title>([\s\S]*?)<\/title>/i)?.[1]
                .replace(/\s+/g, ' ').trim().replace(/&amp;/g, '&');
              const revision = html.match(/<meta\s+name="build-revision"\s+content="([^"]+)"/i)?.[1];
              if (response.ok && title === expectedTitle && revision === process.env.EXPECTED_COMMIT) {
                console.log('The deployed website is ready for browser verification.');
                process.exit(0);
              }
              console.log(`Waiting for GitHub Pages propagation (HTTP ${response.status}).`);
            } catch (error) {
              console.log(`Waiting for GitHub Pages propagation: ${error.message}`);
            }
            const remaining = deadline - Date.now();
            if (remaining > 0) await new Promise(resolve => setTimeout(resolve, Math.min(10_000, remaining)));
          }
          throw new Error('The expected website was not available at the deployment URL within 60 seconds');
          NODE
      - name: Check the deployed website in desktop and mobile Chromium
        run: npm run test:browser
      - name: Upload hosted browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-browser-evidence-${{ github.run_id }}
          path: |
            artifacts/desktop.png
            artifacts/mobile.png
            artifacts/browser-report.json
            docs/PERFORMANCE.md
          if-no-files-found: warn
          retention-days: 14
